services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: domain-copilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: RagContract
      POSTGRES_DB: domain_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: